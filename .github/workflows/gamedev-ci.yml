name: GameDev verified build
on:
  push:
    branches: [main]
    paths: ['gamedev-ai-bench/**', '.github/workflows/gamedev-ci.yml']
  pull_request:
    paths: ['gamedev-ai-bench/**', '.github/workflows/gamedev-ci.yml']
permissions:
  contents: read
concurrency:
  group: gamedev-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gamedev-ai-bench
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gamedev_ci
          POSTGRES_PASSWORD: ephemeral-ci-only-password
          POSTGRES_DB: gamedev_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gamedev_ci -d gamedev_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Isolated Python environment
        run: |
          python3 -m venv /tmp/gamedev-ci
          echo /tmp/gamedev-ci/bin >> "$GITHUB_PATH"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-postgres.txt
      - name: Unit, API, authorization, budgets, provider and MCP contracts
        run: python -m pytest -q --junitxml=evidence/ci-unit-api.xml
      - name: Validate syntax, locale parity, schema and public routes
        run: python scripts/validate.py
      - name: Real PostgreSQL migrations and concurrent leases
        env:
          POSTGRES_TEST_URL: postgresql+psycopg://gamedev_ci:ephemeral-ci-only-password@127.0.0.1:5432/gamedev_ci
        run: python scripts/ci_postgres.py
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Trusted browser components
        env:
          BROWSER_COMPONENT_TESTS: 'true'
        run: python -m pytest tests/test_components.py -q --junitxml=evidence/ci-components.xml
      - name: Real HTTP browser journeys without policy skips
        run: python scripts/e2e.py
      - name: Visual evidence
        run: python scripts/render_preview.py
      - name: Build read-only public site and portable source
        run: python scripts/build.py
      - name: Preserve verification and portable source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gamedev-verified-build
          path: |
            gamedev-ai-bench/evidence/
            gamedev-ai-bench/dist/gamedev-ai-bench-source.zip
            gamedev-ai-bench/dist/site/build-info.json
          retention-days: 14
          if-no-files-found: error
